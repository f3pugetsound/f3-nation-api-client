[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "f3-nation-api-client"
version = "0.3.1"
description = "Typed async Python client for the F3 Nation API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<1"]

[dependency-groups]
dev = ["mypy>=1.15", "pytest>=8.3", "pytest-asyncio>=0.25", "ruff>=0.11"]

[tool.hatch.build.targets.wheel]
packages = ["src/f3_nation_api"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["f3_nation_api"]
